# ループを始める前に人が埋める。空のまま /mule-start を始めない。
# ファイルは各フォルダに置く。URL でもよい。どちらも無ければ unknown と書く。

requirements:          # 何を作りたいかの資料 (要件、業務フロー、画面、既存仕様)
  paths: []            # 例: [context/requirements/order-cancel.md]
  urls:  []            # 例: ["https://confluence.example.com/x/ABC"]
  note:  ""            # 資料が無い場合、口頭で決めることをここに書く

environment:           # 実行環境の資料 (Mule runtime、接続先、コネクタ版)
  paths: []            # 例: [context/environment/systems.md]
  urls:  []
  mule_version: unknown        # 例: 4.12.2。unknown なら自動で調べる。4.9.0 は避ける (gotchas 参照)
  java_version: unknown        # 例: 17
  systems: []                  # 例: [{name: sap, url: "https://...", type: sap}]

deployment:            # デプロイ先の資料
  paths: []
  urls:  []
  targets: []          # 例: [{name: sandbox, type: CH2, env_id: "...", org_id: "..."}]
